name: astrbot_plugin_shadow_ban # 插件唯一识别名
display_name: 影子封禁（Shadow Ban） # 用于展示的名字
short_desc: 静默拦截指定用户，让机器人对他“视而不见”。 # 插件市场卡片短描述
desc: Ban 掉你不喜欢的人，别让你 LLM 宝贵的 Token 浪费掉。群聊 @提及、引用机器人消息、唤醒词触发、私聊消息以及官方“主动回复”都会被拦截。
